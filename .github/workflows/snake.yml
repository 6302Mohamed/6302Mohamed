name: Generate Snake

on:
  schedule:
    # This runs every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The first color (#000000) is the background cell color
          outputs: |
            dist/github-snake.svg?color_snake=#D2A679&color_dots=#16161e,#E8D5C4,#C89B6D,#A8643A,#8B4513
            dist/github-snake-dark.svg?color_snake=#D2A679&color_dots=#16161e,#E8D5C4,#C89B6D,#A8643A,#8B4513
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
